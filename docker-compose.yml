services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobsvc
      POSTGRES_PASSWORD: jobsvc
      POSTGRES_DB: jobs
    command: >
      postgres
        -c shared_buffers=512MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c effective_cache_size=1GB
        -c track_io_timing=on
        -c shared_preload_libraries='pg_stat_statements'
        -c pg_stat_statements.track=all
        -c log_min_duration_statement=100
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobsvc -d jobs" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DATABASE_URL: postgres://jobsvc:jobsvc@postgres:5432/jobs
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MAX_PREPARED_STATEMENTS: 200
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "PING" ]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/recsys-password
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 3G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p recsys-password 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 15

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10

  recsys:
    build:
      context: .
      dockerfile: workspaces/recsys/Dockerfile
    environment:
      PORT: 3020
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: recsys-password
      INTERNAL_SERVICE_SECRET: dev-internal-secret
    ports:
      - "3020:3020"
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  pgdata: {}
  redisdata: {}
  mongodata: {}
  neo4jdata: {}
